name: Bounded Africa latency diagnostic
on:
  push:
    branches: [codex/africa-latency-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Control and conditional measured replay (maximum two)
        timeout-minutes: 18
        run: python3 scripts/diagnostics/africa-latency/run.py
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-africa-latency-evidence
          path: africa-diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7
