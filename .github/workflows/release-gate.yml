name: Release gate

on:
  pull_request:
  push:
    branches-ignore:
      - codex/africa-latency-diagnostic

env:
  COMMIT_REF: ${{ github.sha }}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:gate
      - run: git diff --check

  core-journey-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local app and run deterministic guest journey
        # Leave time inside the existing job budget to publish failed-case
        # traces; repeated failed waits previously exhausted the whole job.
        timeout-minutes: 4
        env:
          MORROVIA_CORE_JOURNEY_BROWSER_TESTS: "1"
          MORROVIA_BASE_URL: http://127.0.0.1:3100
          MORROVIA_BROWSER_ARTIFACT_DIR: core-journey-artifacts
        run: |
          npm run start -- -p 3100 > /tmp/morrovia-core-journey-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3100/journey/new > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3100/journey/new > /dev/null
          npm run test:core-journey-browser
      - name: Run deterministic Transport workspace regression
        env:
          MORROVIA_BUILDER_BROWSER_TESTS: "1"
        run: npm run test:transport-browser
      - name: Upload failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: core-journey-browser-failure
          path: |
            core-journey-artifacts/
            /tmp/morrovia-core-journey-next.log
          if-no-files-found: ignore
          retention-days: 7
