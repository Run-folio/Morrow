name: Release gate
on:
  pull_request:
  push:
env:
  COMMIT_REF: ${{ github.sha }}
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:gate
      - run: git diff --check
  core-journey-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            pattern: '^(?:legacy saved Paris|unconfirmed destination|unconfirmed origin|maintained airport|distinct same-country|unseen multi-country|selected nonseed|choosing a covered island|Canary archipelago|pending Cusco|recorded source town|Tier 1 guest|Tier 1 Discovery|fresh Return default)'
          - group: discovery
            pattern: '^actual (?:Japan|South Korea|Africa) only multi-add'
          - group: multi-desktop
            pattern: '^actual multi-area Discovery 1440px'
          - group: multi-mobile
            pattern: '^actual multi-area Discovery 390px'
          - group: timing
            pattern: '^(?:browser interaction timing|visible interaction timing rejects)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run complete partition within existing guest budget
        timeout-minutes: 4
        env:
          TEST_PATTERN: ${{ matrix.pattern }}
          MORROVIA_CORE_JOURNEY_BROWSER_TESTS: "1"
          MORROVIA_BASE_URL: http://127.0.0.1:3100
          MORROVIA_BROWSER_ARTIFACT_DIR: core-journey-artifacts
          MORROVIA_STAGING_AFRICA_LATENCY_EXCEPTION: ${{ (github.ref_name == 'staging' || github.ref_name == 'codex/staging-africa-latency-exception') && '1' || '0' }}
        run: |
          set -o pipefail
          npm run start -- -p 3100 > /tmp/morrovia-core-journey-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3100/journey/new > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3100/journey/new > /dev/null
          node --experimental-strip-types --test --test-name-pattern="$TEST_PATTERN" tests/core-journey-app-browser.test.ts 2>&1 | tee core-journey.log
      - name: Verify coverage and report known staging failures
        run: node scripts/staging-qualification-summary.mjs '${{ matrix.group }}' core-journey.log core-journey-artifacts
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-journey-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            core-journey-artifacts/
            core-journey.log
            /tmp/morrovia-core-journey-next.log
          retention-days: 7
  transport-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright install --with-deps chrome
      - name: Run unchanged Transport workspace regression
        timeout-minutes: 4
        env:
          MORROVIA_BUILDER_BROWSER_TESTS: "1"
        run: |
          set -o pipefail
          npm run test:transport-browser 2>&1 | tee transport.log
      - run: node scripts/staging-qualification-summary.mjs transport transport.log transport-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transport-qualification-${{ github.run_attempt }}
          path: |
            transport.log
            transport-artifacts/
          retention-days: 7
